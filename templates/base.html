<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tacks{% endblock %}</title>
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
      })();
    </script>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/app.js" defer></script>
    <script src="/static/graph-layout.js" defer></script>
    <script src="/static/graph.js" defer></script>
</head>
<body>
    <header class="app-header">
    <nav class="container nav-tabs" aria-label="Workspace">
        <ul>
            <li><a class="brand" href="/tasks" aria-label="Tacks home"><span class="brand-mark" aria-hidden="true">T</span>Tacks</a></li>
        </ul>
        <ul class="workspace-tabs">
            <li><a id="nav-issues" href="/tasks" hx-get="/tasks" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Issues</a></li>
            <li><a id="nav-board" href="/board" hx-get="/board" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Board</a></li>
            <li><a id="nav-epics" href="/epics" hx-get="/epics" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Epics</a></li>
            <li><a id="nav-graph" href="/graph" hx-get="/graph" hx-target="#main" hx-select="#main" hx-swap="outerHTML scroll:top" hx-push-url="true">Graph</a></li>
        </ul>
        <ul class="workspace-actions">
            <li>
                <button class="new-issue-btn"
                    data-shortcut="n"
                    hx-get="/tasks/new/modal"
                    hx-target="#task-modal"
                    hx-swap="innerHTML">
                    <span aria-hidden="true">+</span> New Issue
                </button>
            </li>
            <li>
                <div class="settings-dropdown" id="settings-dropdown">
                    <button id="settings-gear" class="outline secondary settings-gear-btn" aria-label="Settings" aria-expanded="false">&#9881;</button>
                    <ul class="settings-menu" id="settings-menu" hidden>
                        <li><button id="theme-toggle" class="settings-menu-btn">&#9680; Toggle dark mode</button></li>
                    </ul>
                </div>
            </li>
        </ul>
    </nav>
    </header>
    <main class="container" id="main" hx-history-elt>
        {% block content %}{% endblock %}
    </main>
    <dialog id="task-modal"></dialog>
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
